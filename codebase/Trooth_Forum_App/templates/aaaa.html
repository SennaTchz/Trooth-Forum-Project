<div class="w-full flex flex-col gap-[5px]">
    <h1 class="text-xl font-extrabold">Deus seja louvado.</h1>
    <h3 class="font-['JetBrains_Mono'] text-sm font-extrabold text-green-400">
        [!] こんにちは、Troothへようこそ！
    </h3>
    <p class="font-['JetBrains_Mono'] text-xs text-red-400">
        [*] Só não publique nada ilegal.
    </p>
    <h1 class="text-xl font-extrabold">
        [あなたのメッセージ] | Seja Bem-vindo(a)!
    </h1>
    <form action="{% url 'sendPost_Name' %}" class="max-w-[80%] flex flex-col gap-[5px]" method="POST">
        {% csrf_token %}
        <textarea name="contentPost"
            class="w-full border flex items-center justify-center border-[#3b3b3b] rounded bg-transparent p-[15px]"
            type="text" placeholder="No que você está pensando?"></textarea>
        <button type="submit" class="w-full p-[15px] bg-[#3b3b3b] rounded">Enviar</button>
    </form>
</div>
